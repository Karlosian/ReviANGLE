[ANGLE]
backend=d3d11
frame_pacing=true
frame_pacing_target=0
force_no_vsync=true

[Boost]
timer_fix=true
thread_boost=true
sse_math=true
fast_allocator=true
power_boost=true
gpu_forcer=true

[BoostAdvanced]
tex_compress=true
nvapi_profile=true
shader_cache=true
large_address_aware=true
gl_state_dedup=true
working_set_prefetch=true
fmod_tuning=true
async_asset_loader=true

[BoostRender]
depth_off=true
mipmap_off=true
vbo_pool=true
vertex_compress=true
instancing=true

[BoostLatency]
low_latency=true
safe_latency=true
anti_stutter=true
allow_tearing=true

[BoostGD]
skip_intro=true
object_pool=true
plist_binary=true
level_predecode=true

[BoostPipeline]
effect_lod=true
drawcall_budget=true
iocp_loader=true

[BoostExtreme]
d3d11_unlock=true
process_perf=true
pcore_pin=true
gpu_residency=true
